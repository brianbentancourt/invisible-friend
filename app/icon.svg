<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente de fondo ultra vibrante (Violeta a Fucsia Neón) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="35%" stop-color="#7c3aed"/>
      <stop offset="75%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Resplandor central -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Cinta Dorada Festiva -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Brillo dorado para el lazo -->
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Caja de regalo -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Máscara de incógnito / antifaz del amigo secreto -->
    <linearGradient id="maskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Sombra suave para elementos 3D -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#090514" flood-opacity="0.45"/>
    </filter>

    <filter id="lidShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#090514" flood-opacity="0.25"/>
    </filter>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Contenedor squircle con esquinas redondeadas modernas -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>

  <!-- Brillo ambiental de luz superior -->
  <path d="M0 116C0 51.93 51.93 0 116 0h280c64.07 0 116 51.93 116 116v40C512 172 0 172 0 156v-40z" fill="#ffffff" opacity="0.08"/>
  <circle cx="256" cy="270" r="180" fill="url(#ambientGlow)"/>

  <!-- Borde perimetral sutil -->
  <rect x="4" y="4" width="504" height="504" rx="112" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.25"/>

  <!-- ESTRELLAS MÁGICAS DECORATIVAS (✦) -->
  <!-- Estrella dorada grande superior derecha -->
  <g transform="translate(390, 80) scale(0.9)" filter="url(#glowFilter)">
    <path d="M 0,-36 Q 0,0 36,0 Q 0,0 0,36 Q 0,0 -36,0 Q 0,0 0,-36 Z" fill="#fef08a"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
  </g>

  <!-- Estrella blanca superior izquierda -->
  <g transform="translate(95, 120) scale(0.65)">
    <path d="M 0,-32 Q 0,0 32,0 Q 0,0 0,32 Q 0,0 -32,0 Q 0,0 0,-32 Z" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Estrella pequeña inferior izquierda -->
  <g transform="translate(90, 395) scale(0.55)">
    <path d="M 0,-28 Q 0,0 28,0 Q 0,0 0,28 Q 0,0 -28,0 Q 0,0 0,-28 Z" fill="#fef08a" opacity="0.9"/>
  </g>

  <!-- Destellos circulares -->
  <circle cx="430" cy="350" r="5" fill="#ffffff" opacity="0.8"/>
  <circle cx="410" cy="240" r="3.5" fill="#fde047" opacity="0.7"/>
  <circle cx="105" cy="260" r="4" fill="#ffffff" opacity="0.6"/>

  <!-- GRUPO PRINCIPAL DEL REGALO CON SOMBRA -->
  <g filter="url(#softShadow)">
    <!-- Base de la caja de regalo -->
    <rect x="126" y="220" width="260" height="184" rx="22" fill="url(#boxGrad)"/>

    <!-- Cinta vertical inferior -->
    <rect x="236" y="220" width="40" height="184" fill="url(#goldGrad)"/>
    <rect x="242" y="220" width="8" height="184" fill="#ffffff" opacity="0.35"/>

    <!-- Cinta horizontal en la base -->
    <rect x="126" y="300" width="260" height="36" fill="url(#goldGrad)"/>
    <rect x="126" y="304" width="260" height="6" fill="#ffffff" opacity="0.35"/>

    <!-- ANTIFÁZ DEL AMIGO INVISIBLE (Misterio/Secreto) -->
    <g transform="translate(0, 0)">
      <!-- Sombra del antifaz sobre la caja -->
      <path d="M 180,268 C 205,252 235,264 256,275 C 277,264 307,252 332,268 C 354,282 348,312 326,316 C 300,320 274,302 256,296 C 238,302 212,320 186,316 C 164,312 158,282 180,268 Z" fill="#000000" opacity="0.25" transform="translate(0, 6)"/>
      
      <!-- Cuerpo del antifaz elegante -->
      <path d="M 180,268 C 205,252 235,264 256,275 C 277,264 307,252 332,268 C 354,282 348,312 326,316 C 300,320 274,302 256,296 C 238,302 212,320 186,316 C 164,312 158,282 180,268 Z" fill="url(#maskGrad)" stroke="#6366f1" stroke-width="2.5"/>

      <!-- Ojo izquierdo pícaro / guiño con brillo -->
      <path d="M 198,288 C 204,278 220,278 226,288 C 220,296 204,296 198,288 Z" fill="#ffffff"/>
      <circle cx="212" cy="287" r="4" fill="#38bdf8"/>
      <circle cx="214" cy="285" r="1.5" fill="#ffffff"/>

      <!-- Ojo derecho pícaro con brillo -->
      <path d="M 286,288 C 292,278 308,278 314,288 C 308,296 292,296 286,288 Z" fill="#ffffff"/>
      <circle cx="300" cy="287" r="4" fill="#38bdf8"/>
      <circle cx="302" cy="285" r="1.5" fill="#ffffff"/>

      <!-- Brillo satinado superior del antifaz -->
      <path d="M 188,272 C 210,258 238,270 256,279 C 274,270 302,258 324,272" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
    </g>

    <!-- Tapa del regalo (sobresale ligeramente) -->
    <g filter="url(#lidShadow)">
      <rect x="112" y="166" width="288" height="60" rx="16" fill="url(#boxGrad)"/>
      <!-- Sombra debajo de la tapa -->
      <rect x="112" y="220" width="288" height="6" fill="#000000" opacity="0.08"/>
      <!-- Cinta vertical en la tapa -->
      <rect x="236" y="166" width="40" height="60" fill="url(#goldGrad)"/>
      <rect x="242" y="166" width="8" height="60" fill="#ffffff" opacity="0.35"/>
      <!-- Reflejo superior en la tapa -->
      <rect x="118" y="170" width="276" height="4" rx="2" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- LAZO FESTIVO SUPERIOR (Moña) -->
    <!-- Oreja izquierda del lazo -->
    <path d="M 256,170 C 220,105 130,95 150,155 C 162,192 230,175 256,170 Z" fill="url(#goldGrad)"/>
    <path d="M 256,170 C 220,105 130,95 150,155 C 162,192 230,175 256,170 Z" fill="url(#goldHighlight)"/>
    <path d="M 175,145 C 165,125 210,120 235,160" fill="none" stroke="#b45309" stroke-width="3" opacity="0.3"/>

    <!-- Oreja derecha del lazo -->
    <path d="M 256,170 C 292,105 382,95 362,155 C 350,192 282,175 256,170 Z" fill="url(#goldGrad)"/>
    <path d="M 256,170 C 292,105 382,95 362,155 C 350,192 282,175 256,170 Z" fill="url(#goldHighlight)"/>
    <path d="M 337,145 C 347,125 302,120 277,160" fill="none" stroke="#b45309" stroke-width="3" opacity="0.3"/>

    <!-- Cintas que caen del lazo -->
    <path d="M 244,178 Q 220,205 205,225 Q 218,222 232,216 Q 242,198 248,182 Z" fill="url(#goldGrad)"/>
    <path d="M 268,178 Q 292,205 307,225 Q 294,222 280,216 Q 270,198 264,182 Z" fill="url(#goldGrad)"/>

    <!-- Nudo central de la moña -->
    <ellipse cx="256" cy="172" rx="20" ry="17" fill="url(#goldGrad)"/>
    <ellipse cx="256" cy="170" rx="14" ry="11" fill="#fef08a" opacity="0.6"/>
  </g>
</svg>